[project]
name = "reminal"
version = "0.1.0"
description = "A small, native Qt terminal workspace"
readme = "README.md"
authors = [
    { name = "Dream-Lab", email = "dream-1ab@outlook.com" }
]
requires-python = ">=3.12"
# anytermqt links PySide6's C++ ABI, so the two must be the exact same build;
# upstream pins PySide6==6.10.3, and its wheel is not published on PyPI.
dependencies = [
    "pyside6==6.10.3",
    "anytermqt==0.1.0",
]

[tool.uv.sources]
anytermqt = { path = "vendor/anytermqt-0.1.0-cp39-abi3-macosx_26_0_arm64.whl" }

